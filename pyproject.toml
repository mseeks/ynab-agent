[project]
name = "ynab-agent"
version = "0.1.0"
description = "An AI agent that triages, categorizes, splits, memos, and approves YNAB transactions via per-transaction email threads (Pydantic AI on Temporal)."
readme = "README.md"
# claude-agent-sdk is tested on 3.10-3.13 and the local Homebrew 3.14 ships a
# broken pyexpat, so we pin to a uv-managed 3.13 (see .python-version). Temporal,
# Pydantic AI, and Pydantic v2 all support 3.13.
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.4",
    "temporalio>=1.27.2",
]

[project.optional-dependencies]
# Dev tooling: linters, type-checker, test runner, property-based testing.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.100.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
]
# The Many Hands Engineering loops (agents/) run the Claude Agent SDK on
# subscription OAuth. Kept out of the default env so the domain core stays lean.
loops = [
    "claude-agent-sdk>=0.1.0",
    "python-dotenv>=1.0.0",
]
# The agentic middle: Pydantic AI agents for the model-backed activities. The
# OpenAI provider drives a local Ollama (Gemma 4) over its OpenAI-compatible
# /v1 (SPEC §0.5). Kept out of the default env so the pure core stays lean and
# never pulls the model stack into a workflow sandbox.
ai = [
    "pydantic-ai-slim[openai]>=0.0.20",
]
mail = [
    "agentmail>=0.5.2",
]
# The YNAB REST client (read snapshots, commit decisions, read budget figures).
# A thin httpx adapter behind a protocol; the token comes from the environment.
ynab = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ynab_agent"]

# ── Type checking: strict, the DDD safety net ───────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
show_error_codes = true
# The pydantic plugin teaches mypy about model fields, frozen-ness, and smart
# constructors — load-bearing for "make illegal states unrepresentable".
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "agents"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── Lint + format: ruff, Google style ───────────────────────────────────────
[tool.ruff]
target-version = "py313"
# Google Python Style Guide: 80 columns.
line-length = 80
src = ["src", "tests", "agents"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific
    "D",      # pydocstyle (Google convention)
]
ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method (dunders are self-evident)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
# Pydantic evaluates field-type annotations at runtime to build validators, so
# their imports must NOT be moved into a TYPE_CHECKING block. Tell ruff that
# annotations on these base classes are runtime-evaluated.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "ynab_agent.domain.base.Frozen",
]
# Temporal resolves signal/query/run/activity type hints at runtime to (de)
# serialize payloads, so those imports must NOT move into a TYPE_CHECKING block.
runtime-evaluated-decorators = [
    "temporalio.workflow.signal",
    "temporalio.workflow.query",
    "temporalio.workflow.run",
    "temporalio.activity.defn",
]

[tool.ruff.lint.isort]
known-first-party = ["ynab_agent", "agents"]

[tool.ruff.lint.per-file-ignores]
# Tests document behavior through their names; full docstring coverage is noise.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "ARG"]
# Activity stubs are unimplemented ports: their signatures are the contract, so
# the params are intentionally unused until the real implementations land.
"src/ynab_agent/workflow/activities.py" = ["ARG001"]

# ── Tests ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the agents/ loops importable so their pure signal code is unit-tested.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --cov=ynab_agent --cov-report=term-missing"
